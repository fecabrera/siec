# Project configuration: the include path the language server (and the
# sie tool) resolve imports through, mirroring build.sh's -I list.

[package]
name = "siec"
description = "Modern C-flavored language with minimal syntax, a strong type system and type inference"
version = "0.1.0"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["compiler", "language", "llvm", "sie"]
include = [
    "packages/libc/src",
    "packages/posix/src",
    "packages/tomlc17/src",
    "packages/core/src",
    "packages/mpdecimal/src",
    "packages/zlib/src",
    "packages/libcurl/src",
    "packages/openssl/src",
]
