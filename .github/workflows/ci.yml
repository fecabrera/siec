name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pipenv

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Run tests with coverage
        run: |
          pipenv run coverage run -m pytest -v
          echo "# Coverage Report (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          pipenv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pipenv

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Install libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && \
            sudo apt-get install -y \
            libcurl4-openssl-dev \
            libdrm-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            gobject-introspection \
            valac \
            libvala-0.56-dev \
            libvaladoc-0.56-dev \
            meson \
            ninja-build

          curl -LO https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-4.0.1.tar.gz
          echo "96d33abb4bb0070c7be0fed4246cd38416188325f820468214471938545b1ac8  mpdecimal-4.0.1.tar.gz" | sha256sum -c
          tar xf mpdecimal-4.0.1.tar.gz
          cd mpdecimal-4.0.1
          ./configure
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

          # AdwSidebar was introduced in libadwaita 1.9.  Build its complete
          # dependency stack rather than mixing Ubuntu's older GNOME libraries
          # with newer GTK and libadwaita builds.
          python -m pip install "meson>=1.8,<2"
          hash -r
          SIE_MESON="$(command -v meson)"
          "$SIE_MESON" --version
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

          git clone --branch 2.84.4 --depth 1 https://gitlab.gnome.org/GNOME/glib.git
          "$SIE_MESON" setup glib-build glib \
            --prefix=/usr/local \
            --libdir=lib \
            --buildtype=release \
            -Dintrospection=disabled \
            -Dtests=false
          "$SIE_MESON" compile -C glib-build
          sudo "$SIE_MESON" install -C glib-build
          sudo ldconfig
          pkg-config --atleast-version=2.84.0 glib-2.0 gio-2.0

          git clone --branch 10.4.0 --depth 1 https://github.com/harfbuzz/harfbuzz.git
          "$SIE_MESON" setup harfbuzz-build harfbuzz \
            --prefix=/usr/local \
            --libdir=lib \
            --buildtype=release \
            -Ddocs=disabled \
            -Dtests=disabled \
            -Dutilities=disabled \
            -Dintrospection=disabled
          "$SIE_MESON" compile -C harfbuzz-build
          sudo "$SIE_MESON" install -C harfbuzz-build
          sudo ldconfig
          pkg-config --atleast-version=8.4.0 harfbuzz harfbuzz-subset

          git clone --branch 1.56.4 --depth 1 https://gitlab.gnome.org/GNOME/pango.git
          "$SIE_MESON" setup pango-build pango \
            --prefix=/usr/local \
            --libdir=lib \
            --buildtype=release \
            -Dintrospection=disabled \
            -Dbuild-testsuite=false \
            -Dbuild-examples=false
          "$SIE_MESON" compile -C pango-build
          sudo "$SIE_MESON" install -C pango-build
          sudo ldconfig
          pkg-config --atleast-version=1.56.0 pango pangocairo

          SIE_GTK_VERSION=4.21.1
          git clone --branch "$SIE_GTK_VERSION" --depth 1 https://gitlab.gnome.org/GNOME/gtk.git
          "$SIE_MESON" setup gtk-build gtk \
            --prefix=/usr/local \
            --libdir=lib \
            --buildtype=release \
            -Dbuild-demos=false \
            -Dbuild-examples=false \
            -Dbuild-tests=false \
            -Dbuild-testsuite=false \
            -Dintrospection=disabled \
            -Dmedia-gstreamer=disabled \
            -Dprint-cups=disabled \
            -Dvulkan=disabled \
            -Dwayland-backend=false
          "$SIE_MESON" compile -C gtk-build
          sudo "$SIE_MESON" install -C gtk-build
          sudo ldconfig
          pkg-config --atleast-version=4.21.1 gtk4

          git clone --branch 1.9.0 --depth 1 https://gitlab.gnome.org/GNOME/libadwaita.git
          cd libadwaita
          "$SIE_MESON" setup _build \
            -Dexamples=false \
            -Dintrospection=disabled \
            -Dtests=false \
            -Dvapi=false
          "$SIE_MESON" compile -C _build
          sudo "$SIE_MESON" install -C _build

          # siec links library names directly (for example, -lgtk-4), rather
          # than through pkg-config. Prefer the GTK, Pango, and libadwaita
          # libraries just installed in /usr/local over Ubuntu's older copies.
          echo "LIBRARY_PATH=/usr/local/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install libraries
        if: matrix.os == 'macos-latest'
        run: |
          brew install gtk4 mpdecimal libadwaita
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix mpdecimal)/lib" >> "$GITHUB_ENV"

      - name: Build examples and wheel
        run: |
          pip install -e '.[lsp]'
          for dir in packages/*; do sie install $dir; done
          chmod a+x build.sh
          ./build.sh

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/

      - name: Upload examples
        uses: actions/upload-artifact@v4
        with:
          name: examples-${{ matrix.os }}
          path: |
            examples/*/*/build
            !examples/*/*/build/*.o
