name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pipenv

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Run tests with coverage
        run: |
          pipenv run coverage run -m pytest -v
          echo "# Coverage Report (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          pipenv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pipenv

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv sync --dev

      - name: Install libcurl
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      # ubuntu-latest (24.04) has no libmpdec package - Ubuntu dropped
      # mpdecimal after 22.04 and only reintroduced it in 25.10 - so the
      # library builds from the upstream release instead
      - name: Install libmpdec
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -LO https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-4.0.1.tar.gz
          echo "96d33abb4bb0070c7be0fed4246cd38416188325f820468214471938545b1ac8  mpdecimal-4.0.1.tar.gz" | sha256sum -c
          tar xf mpdecimal-4.0.1.tar.gz
          cd mpdecimal-4.0.1
          ./configure
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      # Ubuntu 24.04 provides GTK 4.14, while the bindings expose APIs added
      # in GTK 4.18. Build the oldest compatible stable release on top of the
      # distribution's development dependencies.
      - name: Install GTK
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libgtk-4-dev meson ninja-build
          SIE_GTK_VERSION=4.18.6
          SIE_GTK_ARCHIVE="gtk-$SIE_GTK_VERSION.tar.xz"
          curl -LO "https://download.gnome.org/sources/gtk/4.18/$SIE_GTK_ARCHIVE"
          echo "e1817c650ddc3261f9a8345b3b22a26a5d80af154630dedc03cc7becefffd0fa  $SIE_GTK_ARCHIVE" | sha256sum -c
          tar xf "$SIE_GTK_ARCHIVE"
          meson setup gtk-build "gtk-$SIE_GTK_VERSION" \
            --prefix=/usr/local \
            --libdir=lib \
            --buildtype=release \
            -Dbuild-demos=false \
            -Dbuild-examples=false \
            -Dbuild-tests=false \
            -Dbuild-testsuite=false \
            -Dintrospection=disabled \
            -Dmedia-gstreamer=disabled \
            -Dprint-cups=disabled \
            -Dvulkan=disabled \
            -Dwayland-backend=false
          meson compile -C gtk-build
          sudo meson install -C gtk-build
          sudo ldconfig
          pkg-config --atleast-version=4.18 gtk4

      - name: Install libadwaita
        if: matrix.os == 'ubuntu-lates'
        run: sudo apt-get install -y libadwaita-1-dev

      - name: Install libraries
        if: matrix.os == 'macos-latest'
        run: |
          brew install gtk4 mpdecimal libadwaita
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix mpdecimal)/lib" >> "$GITHUB_ENV"

      - name: Build Sie
        run: |
          pip install -e '.[lsp]'
          for dir in packages/*; do sie install $dir; done
          chmod a+x build.sh
          ./build.sh

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/

      - name: Upload examples
        uses: actions/upload-artifact@v4
        with:
          name: examples-${{ matrix.os }}
          path: |
            examples/*/*/build
            !examples/*/*/build/*.o
