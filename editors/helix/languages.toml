# Helix language configuration for Sie (.sie files).
#
# Merge this into your Helix `languages.toml` (~/.config/helix/). It gives
# file-type detection, comment toggling (`gc`), auto-indent, bracket/quote
# auto-pairs, and the sie-lsp language server: diagnostics as you type,
# the document outline (`<space>s`), hover (`<space>k`), and
# go-to-definition (`gd`). The server also dims compile-time `@if` arms
# rejected for the active target through semantic highlighting.
#
# `sie-lsp` comes with the compiler: `pip install -e '.[lsp]'`. Point the
# command at an absolute path when it isn't on Helix's PATH. The include
# path comes from the project's package.toml: its [package] include
# entries, plus the sources of the package it declares and of every
# dependency resolved from what `sie install` put down. Extra directories
# (the compiler's -I) go in `config.includePaths`.
#
# Highlighting comes from the tree-sitter grammar beside this file. Point
# the [[grammar]] source at your checkout, copy `runtime/queries/sie` into
# `~/.config/helix/runtime/queries/`, then:
#
#     hx --grammar fetch && hx --grammar build

[language-server.sie-lsp]
command = "sie-lsp"
config = { includePaths = [] }

[[language]]
name = "sie"
scope = "source.sie"
injection-regex = "sie"
file-types = ["sie"]
comment-tokens = ["//"]
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "    " }
auto-pairs = { "(" = ")", "{" = "}", "[" = "]", '"' = '"', "'" = "'" }
language-servers = ["sie-lsp"]

[[grammar]]
name = "sie"
source = { path = "/path/to/sielang/editors/tree-sitter-sie" }
